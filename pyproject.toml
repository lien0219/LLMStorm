[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["gpt_concurrency_test.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
files = ["load_test_engine.py", "web_app.py", "llmstorm"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["load_test_engine", "web_app", "llmstorm"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]
