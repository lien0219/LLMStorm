name: Bug report
description: Report a reproducible problem without including credentials or private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, private relay URLs, customer prompts, or raw production logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider protocol
      options: [OpenAI-compatible, Anthropic, Gemini, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sanitized URLs, keys, prompts, and outputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, and deployment mode.
    validations:
      required: true
