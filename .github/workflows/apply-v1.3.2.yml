name: Apply v1.3.2 release fix

on:
  push:
    branches:
      - fix/cloudflare-csp-v1.3.2

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/cloudflare-csp-v1.3.2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply CSP and version updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old_version = "1.3.1"
          new_version = "1.3.2"

          for raw_path in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode())
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old_version in text:
                  path.write_text(text.replace(old_version, new_version), encoding="utf-8")

          web_app = Path("web_app.py")
          web_text = web_app.read_text(encoding="utf-8")
          old_csp = '            "img-src \'self\' data:; object-src \'none\'; script-src \'self\'; "\n'
          new_csp = (
              '            "img-src \'self\' data:; object-src \'none\'; "\n'
              '            "script-src \'self\' https://static.cloudflareinsights.com; "\n'
          )
          if old_csp not in web_text:
              raise SystemExit("Expected CSP source line was not found")
          web_app.write_text(web_text.replace(old_csp, new_csp, 1), encoding="utf-8")

          tests = Path("tests/test_web.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = (
              '        self.assertIn("frame-ancestors \'none\'", '
              'health.headers["Content-Security-Policy"])\n'
          )
          assertion = marker + (
              '        self.assertIn(\n'
              '            "script-src \'self\' https://static.cloudflareinsights.com",\n'
              '            health.headers["Content-Security-Policy"],\n'
              '        )\n'
          )
          if marker not in test_text:
              raise SystemExit("Expected CSP regression-test marker was not found")
          tests.write_text(test_text.replace(marker, assertion, 1), encoding="utf-8")

          Path(".github/workflows/apply-v1.3.2.yml").unlink()
          PY

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          npm ci

      - name: Run checks
        run: |
          python -m ruff check .
          python -m mypy
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          python -m compileall -q load_test_engine.py web_app.py llmstorm tests
          npm run check

      - name: Commit synchronized changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: allow Cloudflare analytics and release v1.3.2"
          git push origin HEAD:fix/cloudflare-csp-v1.3.2
