services:
  llmstorm:
    build: .
    ports:
      - "8765:8765"
    environment:
      LLMSTORM_PUBLIC_MODE: "1"
      LLMSTORM_MAX_CONCURRENCY: "500"
      LLMSTORM_MAX_ACTIVE_TESTS: "2"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
